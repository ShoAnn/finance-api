openapi: 3.1.0
info:
  title: Finance API
  version: 0.1.0
  summary: Personal finance tracking API
  description: |
    HTTP API for tracking accounts, categories, and transactions.

    Conventions:

    - All monetary values are integer **cents** (`amount_cents`, `balance_cents`).
      For transactions, a positive value is money in and a negative value is
      money out.
    - Identifiers are 64-bit integers (`BIGSERIAL` in Postgres).
    - Dates without a time (`occurred_on`) use `YYYY-MM-DD`; timestamps use
      RFC 3339 / ISO 8601 with an offset (`created_at`, `updated_at`,
      `archived_at`).
    - Request and response bodies are JSON unless noted otherwise.
    - Errors use a consistent envelope: `{"error": {"code": "...", "message": "..."}}`.

    All operations are implemented. Operations carry an
    `x-implementation-status` extension so clients and tooling can confirm
    support.
servers:
  - url: http://localhost:8080
    description: Local development (see compose.yaml)
# Every operation except the health probes requires a bearer API key.
security:
  - BearerAuth: []
tags:
  - name: Health
    description: Liveness and readiness probes.
  - name: Accounts
    description: Bank accounts and other places money is held.
  - name: Categories
    description: Income and expense categories.
  - name: Transactions
    description: Individual money movements.
paths:
  /healthz:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Liveness probe
      description: Reports that the process is running. Does not check dependencies.
      security: []
      x-implementation-status: implemented
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok

  /readyz:
    get:
      tags: [Health]
      operationId: getReadiness
      summary: Readiness probe
      description: |
        Reports whether the API can serve traffic, including a database ping
        with a 2 second timeout.
      security: []
      x-implementation-status: implemented
      responses:
        "200":
          description: API and database are ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
              example:
                status: ready
        "503":
          description: API is running but a dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
              example:
                status: unavailable
                error: database unreachable

  /accounts:
    get:
      tags: [Accounts]
      operationId: listAccounts
      summary: List active accounts
      description: Returns non-archived accounts ordered by name.
      x-implementation-status: implemented
      responses:
        "200":
          description: Active accounts.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Accounts]
      operationId: createAccount
      summary: Create an account
      x-implementation-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountCreate"
      responses:
        "201":
          description: Account created.
          headers:
            Location:
              description: URL of the new account.
              schema:
                type: string
                example: /accounts/42
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /accounts/{accountId}:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    get:
      tags: [Accounts]
      operationId: getAccount
      summary: Get an account
      description: Returns the account whether or not it is archived.
      x-implementation-status: implemented
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Accounts]
      operationId: deleteAccount
      summary: Delete an account
      description: |
        Permanently deletes an account. Fails with `409` while any transaction
        still references it (`ON DELETE RESTRICT`); archive the account or move
        its transactions first.
      x-implementation-status: implemented
      responses:
        "204":
          description: Account deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /accounts/{accountId}/archive:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    post:
      tags: [Accounts]
      operationId: archiveAccount
      summary: Archive an account
      description: |
        Marks the account as archived by setting `archived_at`, hiding it from
        `GET /accounts`. The account and its transactions are retained.
      x-implementation-status: implemented
      responses:
        "200":
          description: The archived account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /accounts/{accountId}/balance:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    get:
      tags: [Accounts]
      operationId: getAccountBalance
      summary: Get an account balance
      description: |
        Sums `amount_cents` across the account's transactions. Accounts with no
        transactions return a balance of `0`.
      x-implementation-status: implemented
      responses:
        "200":
          description: Current balance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Balance"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /categories:
    get:
      tags: [Categories]
      operationId: listCategories
      summary: List categories
      description: Returns all categories ordered by name.
      x-implementation-status: implemented
      responses:
        "200":
          description: Categories.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Categories]
      operationId: createCategory
      summary: Create a category
      x-implementation-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryCreate"
      responses:
        "201":
          description: Category created.
          headers:
            Location:
              description: URL of the new category.
              schema:
                type: string
                example: /categories/7
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: A category with the same name already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: conflict
                  message: category name already exists

  /categories/{categoryId}:
    parameters:
      - $ref: "#/components/parameters/CategoryId"
    put:
      tags: [Categories]
      operationId: updateCategory
      summary: Replace a category
      description: |
        Replaces the category's name and kind. Transactions referencing the
        category keep their `category_id` and are unaffected.
      x-implementation-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryUpdate"
      responses:
        "200":
          description: Updated category.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Another category already uses the requested name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: conflict
                  message: category name already exists
    delete:
      tags: [Categories]
      operationId: deleteCategory
      summary: Delete a category
      description: |
        Deletes the category. Transactions that referenced it keep existing and
        have `category_id` set to `null` (`ON DELETE SET NULL`).
      x-implementation-status: implemented
      responses:
        "204":
          description: Category deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /transactions:
    get:
      tags: [Transactions]
      operationId: listTransactions
      summary: List transactions for an account in a date range
      description: |
        Returns transactions for one account where `occurred_on` is between
        `from` and `to` (inclusive), newest first. `from` must not be after
        `to`.
      x-implementation-status: implemented
      parameters:
        - name: account_id
          in: query
          required: true
          description: Account whose transactions to return.
          schema:
            type: integer
            format: int64
            example: 42
        - name: from
          in: query
          required: true
          description: Start of the range (inclusive).
          schema:
            type: string
            format: date
            example: "2026-01-01"
        - name: to
          in: query
          required: true
          description: End of the range (inclusive).
          schema:
            type: string
            format: date
            example: "2026-01-31"
      responses:
        "200":
          description: Matching transactions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transaction"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Transactions]
      operationId: createTransaction
      summary: Create a transaction
      x-implementation-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionCreate"
      responses:
        "201":
          description: Transaction created.
          headers:
            Location:
              description: URL of the new transaction.
              schema:
                type: string
                example: /transactions/1234
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /transactions/{transactionId}:
    parameters:
      - $ref: "#/components/parameters/TransactionId"
    get:
      tags: [Transactions]
      operationId: getTransaction
      summary: Get a transaction
      x-implementation-status: implemented
      responses:
        "200":
          description: The transaction.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Transactions]
      operationId: updateTransaction
      summary: Replace a transaction
      description: |
        Replaces all mutable fields. Omitted optional fields are cleared, so send
        `null` explicitly if that is the intent.
      x-implementation-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionUpdate"
      responses:
        "200":
          description: Updated transaction.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Transactions]
      operationId: deleteTransaction
      summary: Delete a transaction
      x-implementation-status: implemented
      responses:
        "204":
          description: Transaction deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
      description: |
        One API key per client, created with the `apikey` command. Send it as
        `Authorization: Bearer <key>`; the scheme is matched case-insensitively.
        Only the key's SHA-256 hash is stored server-side, so a key cannot be
        recovered after creation. Keys do not expire but are rejected once
        `revoked_at` is set.

  parameters:
    AccountId:
      name: accountId
      in: path
      required: true
      description: Account identifier.
      schema:
        type: integer
        format: int64
        minimum: 1
        example: 42
    CategoryId:
      name: categoryId
      in: path
      required: true
      description: Category identifier.
      schema:
        type: integer
        format: int64
        minimum: 1
        example: 7
    TransactionId:
      name: transactionId
      in: path
      required: true
      description: Transaction identifier.
      schema:
        type: integer
        format: int64
        minimum: 1
        example: 1234

  responses:
    Unauthorized:
      description: |
        The API key is missing, uses a scheme other than `Bearer`, or does not
        match an active key. Revoked keys are rejected as well.
      headers:
        WWW-Authenticate:
          description: Bearer challenge describing the expected scheme.
          schema:
            type: string
          example: Bearer realm="finance-api"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: unauthorized
              message: missing or invalid API key
    BadRequest:
      description: The request is malformed or fails validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: validation_error
              message: amount_cents must be an integer
              details:
                - field: amount_cents
                  message: expected an integer
    NotFound:
      description: The requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: not_found
              message: account not found
    Conflict:
      description: The request conflicts with the current state of the resource.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: conflict
              message: account has transactions and cannot be deleted

  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok

    ReadinessResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ready, unavailable]
        error:
          type: string
          description: Present when `status` is `unavailable`.
          example: database unreachable

    AccountType:
      type: string
      enum: [checking, savings, credit_card, cash, investment]

    CategoryKind:
      type: string
      enum: [income, expense]

    Account:
      type: object
      required: [id, name, type, currency, created_at, archived_at]
      properties:
        id:
          type: integer
          format: int64
          example: 42
        name:
          type: string
          example: Everyday Checking
        type:
          $ref: "#/components/schemas/AccountType"
        currency:
          type: string
          description: ISO 4217 currency code.
          pattern: "^[A-Z]{3}$"
          example: IDR
        created_at:
          type: string
          format: date-time
          example: "2026-01-15T09:30:00Z"
        archived_at:
          type: [string, "null"]
          format: date-time
          description: When the account was archived, or `null` if active.
          example: null

    AccountCreate:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
          minLength: 1
          example: Everyday Checking
        type:
          $ref: "#/components/schemas/AccountType"
        currency:
          type: string
          description: ISO 4217 currency code. Defaults to `IDR`.
          pattern: "^[A-Z]{3}$"
          default: IDR
          example: IDR

    Category:
      type: object
      required: [id, name, kind, created_at]
      properties:
        id:
          type: integer
          format: int64
          example: 7
        name:
          type: string
          example: Groceries
        kind:
          $ref: "#/components/schemas/CategoryKind"
        created_at:
          type: string
          format: date-time
          example: "2026-01-15T09:30:00Z"

    CategoryCreate:
      type: object
      required: [name, kind]
      properties:
        name:
          type: string
          minLength: 1
          description: Unique category name.
          example: Groceries
        kind:
          $ref: "#/components/schemas/CategoryKind"

    CategoryUpdate:
      type: object
      required: [name, kind]
      description: Full replacement of the mutable category fields.
      properties:
        name:
          type: string
          minLength: 1
          description: Unique category name.
          example: Groceries
        kind:
          $ref: "#/components/schemas/CategoryKind"

    Transaction:
      type: object
      required:
        - id
        - account_id
        - category_id
        - amount_cents
        - description
        - occurred_on
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
          example: 1234
        account_id:
          type: integer
          format: int64
          example: 42
        category_id:
          type: [integer, "null"]
          format: int64
          description: Category, or `null` when uncategorized.
          example: 7
        amount_cents:
          type: integer
          format: int64
          description: Signed amount in cents; positive is money in, negative is money out.
          example: -4599
        description:
          type: [string, "null"]
          example: Weekly grocery run
        occurred_on:
          type: string
          format: date
          example: "2026-01-20"
        created_at:
          type: string
          format: date-time
          example: "2026-01-20T18:05:00Z"
        updated_at:
          type: string
          format: date-time
          example: "2026-01-20T18:05:00Z"

    TransactionCreate:
      type: object
      required: [account_id, amount_cents, occurred_on]
      properties:
        account_id:
          type: integer
          format: int64
          example: 42
        category_id:
          type: [integer, "null"]
          format: int64
          description: Omit or send `null` when uncategorized.
          example: 7
        amount_cents:
          type: integer
          format: int64
          description: Signed amount in cents; positive is money in, negative is money out.
          example: -4599
        description:
          type: [string, "null"]
          example: Weekly grocery run
        occurred_on:
          type: string
          format: date
          example: "2026-01-20"

    TransactionUpdate:
      type: object
      required: [account_id, amount_cents, occurred_on]
      description: Full replacement of the mutable transaction fields.
      properties:
        account_id:
          type: integer
          format: int64
          example: 42
        category_id:
          type: [integer, "null"]
          format: int64
          description: Send `null` to remove the category.
          example: 7
        amount_cents:
          type: integer
          format: int64
          description: Signed amount in cents; positive is money in, negative is money out.
          example: -4599
        description:
          type: [string, "null"]
          description: Send `null` to clear the description.
          example: Weekly grocery run
        occurred_on:
          type: string
          format: date
          example: "2026-01-20"

    Balance:
      type: object
      required: [account_id, balance_cents]
      properties:
        account_id:
          type: integer
          format: int64
          example: 42
        balance_cents:
          type: integer
          format: int64
          description: Sum of the account's transaction amounts in cents.
          example: 152340

    ErrorDetail:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          example: amount_cents
        message:
          type: string
          example: expected an integer

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable error code.
              example: not_found
            message:
              type: string
              description: Human-readable explanation.
              example: account not found
            details:
              type: array
              description: Field-level validation failures, when applicable.
              items:
                $ref: "#/components/schemas/ErrorDetail"
