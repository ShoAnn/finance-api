version: "2"
sql:
  - engine: "postgresql"
    # List migrations explicitly so sqlc never parses the .down.sql files.
    # Add each new up migration here.
    schema:
      - "migrations/001_create_personal_finance_schema.up.sql"
    queries: "db/queries"
    gen:
      go:
        package: "sqlc"
        out: "db/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
