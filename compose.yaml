name: finance-api

x-postgres-env: &postgres-env
  POSTGRES_USER: ${POSTGRES_USER:-finance}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finance}
  POSTGRES_DB: ${POSTGRES_DB:-finance}

x-database-url: &database-url "postgres://${POSTGRES_USER:-finance}:${POSTGRES_PASSWORD:-finance}@db:5432/${POSTGRES_DB:-finance}?sslmode=disable"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment: *postgres-env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # Applies migrations/ with golang-migrate, then exits. `api` waits for it to
  # finish successfully. Re-running `up` against an already-migrated database
  # is a no-op, so it is safe to start the stack repeatedly.
  migrate:
    image: migrate/migrate:v4.18.3
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database"
      - *database-url
      - "up"

  # One-off key generator. `docker compose run --rm apikey -name laptop`
  # prints a new key once and exits; only its SHA-256 hash is stored.
  apikey:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["tools"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: *database-url
    entrypoint: ["/usr/local/bin/apikey"]

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # The API drains in-flight requests for up to 10s on SIGTERM; give the
    # process headroom so Docker does not SIGKILL it mid-drain.
    stop_grace_period: 15s
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      PORT: "8080"
      DATABASE_URL: *database-url
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      SHUTDOWN_TIMEOUT: "${SHUTDOWN_TIMEOUT:-10s}"
      STARTUP_TIMEOUT: "${STARTUP_TIMEOUT:-5s}"
      READINESS_TIMEOUT: "${READINESS_TIMEOUT:-2s}"
      HTTP_READ_HEADER_TIMEOUT: "${HTTP_READ_HEADER_TIMEOUT:-5s}"
      HTTP_READ_TIMEOUT: "${HTTP_READ_TIMEOUT:-10s}"
      HTTP_WRITE_TIMEOUT: "${HTTP_WRITE_TIMEOUT:-15s}"
      HTTP_IDLE_TIMEOUT: "${HTTP_IDLE_TIMEOUT:-60s}"
      DB_MAX_CONNS: "${DB_MAX_CONNS:-}"
      DB_MIN_CONNS: "${DB_MIN_CONNS:-}"
      DB_MAX_CONN_LIFETIME: "${DB_MAX_CONN_LIFETIME:-1h}"
      DB_MAX_CONN_IDLE_TIME: "${DB_MAX_CONN_IDLE_TIME:-30m}"
      DB_HEALTH_CHECK_PERIOD: "${DB_HEALTH_CHECK_PERIOD:-1m}"
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  pgdata:
